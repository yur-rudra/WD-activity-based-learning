<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone Homes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px Arial, sans-serif; color: #263b30; background: #f5f6f1; }
  header { padding: 18px 7%; display: flex; justify-content: space-between; background: white; }
  nav a { margin-left: 18px; text-decoration: none; color: inherit; }
  main { max-width: 1100px; margin: auto; padding: 32px 20px; }
  h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
  .filters, .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .filters { background: white; padding: 16px; border-radius: 14px; }
  input, select { padding: 11px; border: 1px solid #d5ded5; border-radius: 8px; }
  button { padding: 11px 16px; border: 0; border-radius: 9px; color: white; background: #446b57; cursor: pointer; }
  .grid { margin: 22px 0; }
  .card { background: white; border-radius: 15px; padding: 14px; }
  .house { height: 145px; display: grid; place-items: center; border-radius: 10px; background: #e4eee5; font-size: 70px; }
  .price { font-size: 1.1rem; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e0e5df; }
  @media (max-width: 600px) { header { display: block; } nav { margin-top: 12px; } nav a { margin: 0 12px 0 0; } }
</style>
</head>
<body>
<header><strong>KEYSTONE HOMES</strong>
  <nav><a href="#listings">Buy</a><a href="#listings">Rent</a><a href="#contact">Contact</a></nav>
</header>
<main>
  <h1>Space for your next chapter.</h1>
  <p>Explore homes, apartments, and rentals in your neighbourhood.</p>
  <section class="filters">
    <input id="location" placeholder="Location">
    <select id="type"><option value="">Any property type</option><option>House</option><option>Apartment</option></select>
    <input id="maxPrice" type="number" placeholder="Maximum price (LKR)">
    <select id="beds"><option value="0">Any bedrooms</option><option value="2">2+ beds</option><option value="3">3+ beds</option></select>
    <button onclick="applyFilters()">Search</button>
  </section>
  <h2 id="listings">Featured properties</h2>
  <section class="grid" id="homes"></section>
  <h2>Compare properties</h2>
  <table>
    <thead><tr><th>Property</th><th>Price</th><th>Beds / baths</th><th>Status</th></tr></thead>
    <tbody id="comparison"></tbody>
  </table>
  <h2 id="contact">Contact Keystone Homes</h2>
  <p>Call (555) 014-7788 to ask a question or book a viewing.</p>
</main>
<script>
const homes = [
  {name:"Courtyard House", type:"House", location:"Nawala, Colombo", price:68500000, beds:4, baths:3, status:"For sale", icon:"🏡"},
  {name:"Harbour View Flat", type:"Apartment", location:"Wellawatte, Colombo", price:145000, beds:2, baths:2, status:"For rent", icon:"🏢"},
  {name:"Cedar Lane Townhome", type:"House", location:"Rajagiriya", price:42000000, beds:3, baths:2, status:"For sale", icon:"🏠"}
];
function render(list) {
  document.querySelector("#homes").innerHTML = list.map((h,i) => `
    <article class="card"><div class="house">${h.icon}</div>
    <h3>${h.name}</h3><p>${h.location}</p>
    <p class="price">LKR ${h.price.toLocaleString()}</p>
    <p>${h.beds} beds · ${h.baths} baths · ${h.status}</p>
    <button onclick="compare(${i})">Add to comparison</button></article>
  `).join("");
}
function applyFilters() {
  const loc = document.querySelector("#location").value.toLowerCase();
  const type = document.querySelector("#type").value;
  const max = Number(document.querySelector("#maxPrice").value) || Infinity;
  const beds = Number(document.querySelector("#beds").value);
  render(homes.filter(h => h.location.toLowerCase().includes(loc) &&
    (!type || h.type === type) && h.price <= max && h.beds >= beds));
}
function compare(i) {
  const h = homes[i];
  document.querySelector("#comparison").innerHTML +=
    `<tr><td>${h.name}</td><td>LKR ${h.price.toLocaleString()}</td>
     <td>${h.beds} / ${h.baths}</td><td>${h.status}</td></tr>`;
}
render(homes);
</script>
</body>
</html>
